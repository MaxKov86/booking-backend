services:
  - type: web
    name: booking-backend
    runtime: node
    plan: free
    # --include=dev ОБОВ'ЯЗКОВИЙ: NODE_ENV=production (нижче) змушує npm
    # пропускати devDependencies, а саме там лежать typescript і @types/*,
    # без яких `tsc` не скомпілює проект. Без цього прапорця збірка падає
    # з помилками "Cannot find name 'process'" / "Cannot find name 'console'".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # NODE_ENV=production потрібен рантайму (наша логіка в server.ts
      # покладається на нього), але саме він і ламає встановлення
      # devDependencies на етапі збірки — звідси --include=dev вище
      - key: NODE_ENV
        value: production
      # Решту (MONGODB_URI, JWT_SECRET, CORS_ORIGIN, SMTP_*) задай
      # вручну в Render Dashboard -> Environment. sync: false означає
      # "не братимемо значення з цього файлу" — секрети не повинні
      # потрапляти в git
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
